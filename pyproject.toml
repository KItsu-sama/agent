[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "An approval-gated coding agent built with the OpenHands SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk>=1.53.0",
    "openhands-tools>=1.54.0,<2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
code-agent = "code_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

