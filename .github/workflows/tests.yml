name: Tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
